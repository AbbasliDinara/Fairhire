<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-image: url('/static/99.jpg'); /* Arka plan resmi */
           /* Resmin tamamının görünmesini sağlar */
           background-size: 1550px 700px ;
           
            background-repeat: no-repeat; /* Resmin tekrar etmesini engeller */
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            /* Three equal columns */
            /* gap: 10px; */
            /* Spacing between columns */
        }

        .box {
            padding: 20px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .textarea {
            border-radius: 10px;
        }

        .submit_button {
            padding: 10px;
            background-color: darkslategray;
            color: azure;
            border-radius: 15px;
            font-size: large;
        }

        .pause_button {
            padding: 10px;
            background-color: lightcoral;
            color: black;
            border-radius: 15px;
            font-size: large;
        }

        .resume_button {
            padding: 10px;
            background-color: lightgreen;
            color: black;
            border-radius: 15px;
            margin-left: 10px;
            font-size: large;
        }
    </style>
</head>

<body>
    <br>
    <h1 style="text-align: center; color: rgb(0, 1, 1);">Resume Analyzer Application</h1>
    <div class="container">
        <div class="box">
            <h1  style="text-align: center; color: #795458;">Select Best Candidates</h1>
            <form action="/select_best_candidates" method="post" enctype="multipart/form-data">
                <input type="hidden" name="analysis_type" value="third">
                <br>
                <ul>
                    <li>You can select multiple Resumes/CV and AI will choose the Best candidates as per provided Job Desciption</li>
                </ul>
                <br>
                <label>Select Multiple Resumes (pdfs):</label>
                <input type="file" name="resume_files[]" multiple required>
                <br>
                <br>
                <textarea class="textarea" type="text" name="job_description" rows="6" cols="50" required></textarea>
                <br>
                <br>
                <label>Enter Priority (e.g. Experience, Education, Skills etc.):</label>
                <input type="text" name="priority" required>
                <br>
                <br>
                <label>Number of Candidates to select (e.g. 2, 3, 4 etc.):</label>
                <input type="text" name="num_of_candidates" required>
                <br>
                <br>
                <button class="submit_button" type="submit">Select Best Ones</button>
            </form>

            <br>
            <br>
        </div>

        
    
    
    </div>

    <br>
</body>

</html>
