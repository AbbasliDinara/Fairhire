<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color:#8D7B68; /* Arka plan resmi */
           /* Resmin tamamının görünmesini sağlar */
           background-size: 1550px 700px ;
           
            background-repeat: no-repeat; /* Resmin tekrar etmesini engeller */
            margin: 0;
            padding: 0;
        }

        #form_text {
            font-family: Arial, Helvetica, sans-serif;
            font-size: x-large;
            align-self: left;
        }

        .grid-container {
            display: grid;
            grid-template-columns: auto auto;
            padding: 5px;
        }

        .grid-item {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 3px;
            text-align: center;
            
        }
        .text-padding {
            padding: 30px; /* Metinlere padding ekler */
        }

    </style>
    <title>Resume Analyzer App</title>
</head>

<body>
    <div class="container text-center pt-0">
        <img src="/static/image.jpg" alt="Responsive image" height="180" width="360">
    </div>
    <p  class="text-padding" style="color: aliceblue;">{{ ai_answer }}</p>
    <!-- <p  class="text-padding" style="color: aliceblue;">{{ experience_score }}</p>
    <p  class="text-padding" style="color: aliceblue;">{{ education_score }}</p>
    <p  class="text-padding" style="color: aliceblue;">{{ skills_score }}</p> -->
    <div class="container text-center pt-0">
        <img src="/static/chart.png" />
    </div>

        <div class="container pt-3">
            <ul class="text-padding" style="color: aliceblue;">
                {% for score, candidate_name, why_score in top_candidates %}
                    <li style="color: aliceblue;"> <b>Score:</b> {{ score }}, <b>Candidate:</b> {{ candidate_name }}
                    <br>
                    <b>Reason:</b> {{ why_score }}</li>
                    <hr>
                {% endfor %}
            </ul>
        </div>
        <!-- <a href="/static/all_resumes/resume_1.pdf" download>Download Resume</a> -->
        <div class="container text-center pt-2">
            <form action="/use_app">
            <button class="btn btn-primary"style="            padding: 10px;
            background-color: darkslategray;
            color: azure;
            border-radius: 15px;
            font-size: large;">Use App Again</button>
        </form>
        </div>
        <br>
        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
            integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
            integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
            crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
            integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
            crossorigin="anonymous"></script>
</body>

</html>
